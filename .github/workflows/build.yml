      - name: Build info
        working-directory: proj
        run: |
          printf 'package com.nakyung.tally\nobject BuildInfo {\n    const val REPO = "%s"\n    const val BUILD = %s\n}\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_NUMBER" > app/src/main/java/com/nakyung/tally/BuildInfo.kt
          cat app/src/main/java/com/nakyung/tally/BuildInfo.kt

      - name: Build APK
        working-directory: proj
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp proj/app/build/outputs/apk/release/app-release.apk "Tally-$GITHUB_RUN_NUMBER.apk"

      - name: Publish APK (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 탈리 ${{ github.run_number }}
          files: Tally-${{ github.run_number }}.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: Tally-APK
          path: proj/app/build/outputs/apk/release/*.apk
