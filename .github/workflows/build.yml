                              .apply { setMargins(0, dp(4), 0, dp(4)) }
                      }
                      checks.add(Pair(cb, f)); root.addView(cb)
                  }
                  root.addView(btn("✔  체크한 파일 불러오기", TEAL) {
                      val sel = checks.filter { it.first.isChecked }.map { it.second }
